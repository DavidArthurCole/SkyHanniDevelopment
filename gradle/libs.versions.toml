[versions]
# libraries
junit = "4.13.2"
opentest4j = "1.3.0"
devtoolsKsp = "2.3.12"
# plugins
changelog = "2.5.0"
intelliJPlatform = "2.19.0"
kotlin = "2.4.21"
kover = "0.9.11"
qodana = "2026.2.2"
detekt = "2.0.0-alpha.6"
detektrules-neu = "1.0.0"
benManesVersions = "0.66.0"
versionCatalogUpdate = "1.1.2"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
opentest4j = { module = "org.opentest4j:opentest4j", version.ref = "opentest4j" }
autoservice_ksp = "dev.zacsweers.autoservice:auto-service-ksp:1.2.0"
autoservice_annotations = "com.google.auto.service:auto-service-annotations:1.1.1"
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
detektrules-ktlint = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }
detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt" }
detektrules-neu = { module = "org.notenoughupdates:detektrules", version.ref = "detektrules-neu" }
detektrules-authors = { module = "dev.detekt:detekt-rules-ruleauthors", version.ref = "detekt" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
devtoolsKsp = { id = "com.google.devtools.ksp", version.ref = "devtoolsKsp" }
benManesVersions = { id = "io.github.ben-manes.versions", version.ref = "benManesVersions" }
versionCatalogUpdate = { id = "nl.littlerobots.version-catalog-update", version.ref = "versionCatalogUpdate" }
